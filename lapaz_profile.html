<style>
:root{--bg:#F1F3F4;--ink:#1E2428;--muted:#5B6670;--grid:#D5DADE;--fill:#E3CFA8;--edge:#7A5530;--route:#1F5FD6;--card:#FFFFFF;--tab:#E2E6E9;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181B;--ink:#E7ECEF;--muted:#98A4AD;--grid:#2C3439;--fill:#4E3F2A;--edge:#E2C38E;--route:#6FA8FF;--card:#1B2024;--tab:#232A2F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181B;--ink:#E7ECEF;--muted:#98A4AD;--grid:#2C3439;--fill:#4E3F2A;--edge:#E2C38E;--route:#6FA8FF;--card:#1B2024;--tab:#232A2F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:1120px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:"Gowun Batang","Nanum Myeongjo",serif;font-weight:700;font-size:clamp(22px,3.2vw,32px);margin:0 0 14px;letter-spacing:-0.01em}
.tabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.tabs a{padding:8px 16px;border-radius:999px;background:var(--tab);color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.view[hidden]{display:none}
.map{position:relative;width:100%;aspect-ratio:1603/628;border-radius:6px;overflow:hidden;touch-action:none;cursor:crosshair;background:#333}
.map img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.readout{display:flex;gap:28px;align-items:baseline;margin:18px 2px 8px;flex-wrap:wrap}
.readout div{display:flex;align-items:baseline;gap:8px}
.readout span{color:var(--muted);font-size:14px}
.readout b{font-weight:500;font-size:clamp(24px,3vw,30px);font-variant-numeric:tabular-nums}
.profile{background:var(--card);border-radius:6px;padding:8px 6px 4px;touch-action:pan-y;cursor:crosshair}
.profile svg{width:100%;height:auto;display:block}
.profile text{fill:var(--muted);font-size:13px;font-family:inherit}
.profile:focus-visible,.map:focus-visible{outline:2px solid var(--route);outline-offset:3px}
.lines{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin:0 0 10px}
.line{display:flex;gap:6px;align-items:center;background:var(--card);border-radius:6px;padding:5px 8px;cursor:pointer;border:2px solid transparent}
.line:has(input:checked){border-color:var(--c)}
.line input{margin-top:0;width:18px;height:18px;accent-color:var(--c);flex:none}
.line .sw{display:inline-block;width:22px;height:4px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:6px}
.line strong{font-weight:600}
.line small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}

 {id:'l2',name:'노선 2',c:'#2E9B7E',off:8,f:k=>3540}
];
LINES.forEach(L=>{let g=0,dep=0;for(let k=0;k<KM;k+=0.05){const a=L.f(k),b=L.f(Math.min(KM,k+0.05));g=Math.max(g,Math.abs(b-a)/(0.05*1000)*100);dep=Math.max(dep,elevAt(k)-a)}L.grade=g;L.depth=dep});

function build(root,subway){
 root.appendChild(document.getElementById('tpl').content.cloneNode(true));
 const map=root.querySelector('.map'),msvg=map.querySelector('svg'),ps=root.querySelector('.profile svg'),prof=root.querySelector('.profile');
 map.querySelector('img').src=IMG;
 const el=(t,a,p=ps)=>{const n=document.createElementNS(ns,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
 for(let e=3500;e<=4100;e+=100){el('line',{x1:X0,x2:X1,y1:sy(e),y2:sy(e),stroke:'var(--grid)','stroke-width':1});el('text',{x:X0-10,y:sy(e)+4,'text-anchor':'end'}).textContent=e.toLocaleString()+' m'}
 for(let k=0;k<=13;k++){el('line',{x1:sx(k),x2:sx(k),y1:Y1,y2:Y0,stroke:'var(--grid)','stroke-width':1});el('text',{x:sx(k),y:Y0+22,'text-anchor':'middle'}).textContent=k+(k===0?' km':'')}
 const pts=P.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' L');
 el('path',{d:'M'+sx(0)+','+Y0+' L'+pts+' L'+sx(KM)+','+Y0+' Z',fill:'var(--fill)'});
 el('path',{d:'M'+pts,fill:'none',stroke:'var(--edge)','stroke-width':2.5,'stroke-linejoin':'round'});
 const parts={};
 if(subway){
  const box=root.querySelector('.lines');box.hidden=false;
  LINES.forEach(L=>{
   let d='';for(let k=0;k<=KM+1e-9;k+=0.05)d+=(d?' L':'M')+sx(Math.min(k,KM)).toFixed(1)+','+sy(L.f(Math.min(k,KM))).toFixed(1);
   const pp=el('path',{d,fill:'none',stroke:L.c,'stroke-width':3.5,'stroke-linejoin':'round'});
   const st=[0,BND,KM].map(k=>el('circle',{cx:sx(k),cy:sy(L.f(k)),r:5,fill:'#fff',stroke:L.c,'stroke-width':2.5}));
   let md='';R.forEach((p,i)=>{const q=R[Math.min(R.length-1,i+1)],o=R[Math.max(0,i-1)];let dx=q[0]-o[0],dy=q[1]-o[1];const n=Math.hypot(dx,dy)||1;md+=(md?' L':'M')+(p[0]-dy/n*L.off).toFixed(1)+','+(p[1]+dx/n*L.off).toFixed(1)});
   const mp=el('path',{d:md,fill:'none',stroke:L.c,'stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'},msvg.querySelector('.mlines'));
   const lab=document.createElement('label');lab.className='line';lab.style.setProperty('--c',L.c);
   lab.innerHTML='<input type="checkbox" checked aria-label="'+L.name+' 보이기"><i class="sw" style="margin-right:0"></i>';
   box.appendChild(lab);
   const cb=lab.querySelector('input');cb.addEventListener('change',()=>{const v=cb.checked?'':'none';pp.style.display=v;mp.style.display=v;st.forEach(s=>s.style.display=v)});
   
  });
 }
 const MK=[['A',0],['B',BND],['C',KM]];
 MK.forEach(([Lb,k])=>{const x=sx(k),y=sy(elevAt(k));el('circle',{cx:x,cy:y,r:5,fill:'var(--ink)'});const t=el('text',{x,y:y-12,'text-anchor':'middle'});t.textContent=Lb;t.style.cssText='fill:var(--ink);font-size:18px;font-weight:700'});
 const mk=msvg.querySelector('.mk');
 MK.forEach(([Lb,k])=>{const [x,y]=routeAt(k),g=document.createElementNS(ns,'g');g.innerHTML='<circle cx="'+x+'" cy="'+(y-38)+'" r="22" fill="#fff" stroke="#1E2428" stroke-width="3"/><text x="'+x+'" y="'+(y-30)+'" text-anchor="middle" fill="#1E2428" font-size="24" font-weight="700">'+Lb+'</text>';mk.appendChild(g)});
 const pv=el('line',{y1:Y1,y2:Y0,stroke:'var(--route)','stroke-width':1.5});
 const pd=el('circle',{r:7,fill:'#FFD84D',stroke:'var(--ink)','stroke-width':2.5});
 const mv=msvg.querySelector('.mv'),mdot=msvg.querySelector('.md'),rk=root.querySelector('.rk'),re=root.querySelector('.re');
 let cur=0;
 function set(k){cur=Math.max(0,Math.min(KM,k));const e=elevAt(cur),[x,y]=routeAt(cur);
  mdot.setAttribute('cx',x);mdot.setAttribute('cy',y);mv.setAttribute('x1',x);mv.setAttribute('x2',x);
  pv.setAttribute('x1',sx(cur));pv.setAttribute('x2',sx(cur));pd.setAttribute('cx',sx(cur));pd.setAttribute('cy',sy(e));
  rk.textContent=cur.toFixed(1)+' km';re.textContent=Math.round(e).toLocaleString()+' m';
  for(const id in parts){const p=parts[id];p.now.textContent='지금 위치 깊이: '+Math.max(0,Math.round(e-p.L.f(cur)))+'m'}}
 function onMap(ev){const r=map.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*1603,y=(ev.clientY-r.top)/r.height*628;let best=0,bd=1e12;for(const p of R){const dd=(p[0]-x)**2+(p[1]-y)**2;if(dd<bd){bd=dd;best=p[2]}}set(best)}
 function onProf(ev){const r=ps.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*1000;set((x-X0)/(X1-X0)*KM)}
 map.addEventListener('pointermove',onMap);map.addEventListener('pointerdown',onMap);
 prof.addEventListener('pointermove',onProf);prof.addEventListener('pointerdown',onProf);
 for(const n of [map,prof])n.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){set(cur+0.1);e.preventDefault()}if(e.key==='ArrowLeft'){set(cur-0.1);e.preventDefault()}});
 set(0);
}
build(document.getElementById('v-profile'),false);
build(document.getElementById('v-subway'),true);
function route(){const v=(location.hash||'#profile').slice(1);const ok=v==='subway'?'subway':'profile';
 document.querySelectorAll('.view').forEach(s=>s.hidden=s.dataset.view!==ok);
 document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.v===ok)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});}
addEventListener('hashchange',route);route();
</script></body></html>
